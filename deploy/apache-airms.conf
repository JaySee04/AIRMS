# AIRMS behind Apache, ONE hostname — for a server that runs Apache rather than
# nginx (ISN's Virtualmin box does; deploy/nginx-airms.conf is the nginx form).
#
#   https://airms.isn.gov.my/api/...  ->  the API   (127.0.0.1:5000)
#   https://airms.isn.gov.my/...      ->  the web   (127.0.0.1:3000)
#
# Build the frontend with NEXT_PUBLIC_API_URL=https://<host>/api and set the
# API's FRONTEND_URL=https://<host> — i.e. `configure.sh --web <host> --api <host>`.
# One hostname means one DNS record and one certificate; the two-hostname layout
# needed a second record ISN had not yet created (2026-10-22). Every backend
# route already lives under /api and the web app has no /api route of its own,
# so the split is unambiguous.
#
# Install (as root):
#   cp apache-airms.conf /etc/apache2/sites-available/airms.conf
#   a2enmod proxy proxy_http headers ssl && a2ensite airms && systemctl reload apache2
#   certbot --apache -d airms.isn.gov.my     # writes the :443 copy of this vhost
#
# certbot COPIES this block into airms-le-ssl.conf, so nothing below may assume
# plain HTTP — hence X-Forwarded-Proto is derived per request, not written in.

<VirtualHost *:80>
    ServerName airms.isn.gov.my

    ProxyRequests Off
    ProxyPreserveHost On

    # The API trusts exactly ONE proxy hop (server.js: trust proxy 1) and reads
    # the client address from the right-hand end of X-Forwarded-For, which
    # mod_proxy_http appends. Without that, every request would arrive as
    # 127.0.0.1 — and the login throttle EXEMPTS loopback, so brute-force
    # protection would silently switch off behind this proxy.
    RequestHeader set X-Forwarded-Proto "https" "expr=%{HTTPS} == 'on'"
    RequestHeader set X-Forwarded-Proto "http"  "expr=%{HTTPS} != 'on'"

    # HSTS: once a browser has seen this over HTTPS it never tries plain HTTP
    # again, so a sign-in cannot be downgraded on a hostile network. Sent on
    # the HTTPS copy only (a header over HTTP is ignored by spec). Neither app
    # sets it — helmet's HSTS on the API is moot when the proxy terminates TLS.
    Header always set Strict-Transport-Security "max-age=31536000" "expr=%{HTTPS} == 'on'"

    # PDF extraction can take several seconds; the vision fallback longer.
    ProxyTimeout 120

    # Order matters: the more specific prefix first.
    ProxyPass        /api http://127.0.0.1:5000/api
    ProxyPassReverse /api http://127.0.0.1:5000/api
    ProxyPass        /    http://127.0.0.1:3000/
    ProxyPassReverse /    http://127.0.0.1:3000/
</VirtualHost>
