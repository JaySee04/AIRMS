# AIRMS reverse proxy — TLS terminates HERE. AIRMS speaks plain HTTP and has no
# certificate handling, so without this (or an equivalent) IC numbers and
# clinical notes travel in clear. An IC encodes date of birth, birth state and
# sex, so that is a disclosure, not a tidiness issue.
#
#   sudo cp deploy/nginx-airms.conf /etc/nginx/sites-available/airms
#   sudo ln -s /etc/nginx/sites-available/airms /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d airms.isn.gov.my -d airms-api.isn.gov.my
#   sudo nginx -t && sudo systemctl reload nginx
#
# REPLACE THE TWO HOSTNAMES AND NOTHING ELSE.
#
# TWO ORIGINS, ALWAYS. The web app and the API must be separate names. They are
# separate processes with separate ports, FRONTEND_URL is the backend's CORS
# allow-list, and NEXT_PUBLIC_API_URL is baked into the frontend AT BUILD TIME.
# Collapsing them onto one host with a /api prefix means rebuilding the frontend
# and re-deriving the CSP's connect-src, which is not a config change.

# ---------------------------------------------------------------------------
# Redirect every plain-HTTP request. Certbot adds its own; this is the explicit
# version so the file reads correctly before certbot has run.
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name airms.isn.gov.my airms-api.isn.gov.my;
    location / { return 301 https://$host$request_uri; }
}

# ---------------------------------------------------------------------------
# Web app (Next.js, :3000)
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name airms.isn.gov.my;

    # certbot fills these in. Until it has, nginx will not start — which is the
    # right failure: serving this without TLS is the thing to prevent.
    # ssl_certificate     /etc/letsencrypt/live/airms.isn.gov.my/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/airms.isn.gov.my/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # HSTS. Deliberately WITHOUT preload: preloading is close to irreversible,
    # and that is ISN's decision rather than a default to inherit.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # AIRMS sets its own CSP, frame-ancestors, Referrer-Policy, nosniff and
    # Permissions-Policy in next.config.js and src/middleware.ts. DO NOT add
    # them here: two Content-Security-Policy headers are enforced as an
    # INTERSECTION, so a second copy silently changes the effective policy.

    client_max_body_size 20m;   # must match AIRMS_MAX_UPLOAD_BYTES

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ---------------------------------------------------------------------------
# API (Express, :5000)
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name airms-api.isn.gov.my;

    # ssl_certificate     /etc/letsencrypt/live/airms-api.isn.gov.my/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/airms-api.isn.gov.my/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # THE DEFAULT HERE IS 1 MB AND WOULD REFUSE EVERY REPORT. Real HoloMotion
    # exports run to 13.67 MB; AIRMS accepts 20 MB unless told otherwise. If you
    # change one of these, change the other — a mismatch fails as an opaque 413
    # at the proxy, before any AIRMS code runs and before any AIRMS log sees it.
    client_max_body_size 20m;

    # A 38-page report is extracted synchronously on import. 60s is generous for
    # the text-layer path (~0.5s) and leaves room for the vision fallback.
    proxy_read_timeout 60s;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The login throttle is keyed per IP. Without this every request looks
        # like it came from the proxy, so ONE brute-force attempt would lock out
        # the whole institution — and a real attacker would be unthrottled.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
