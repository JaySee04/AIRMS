<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>AIRMS — Use Case Diagram: Data Management Module</title>
<style>
  html, body { margin: 0; padding: 0; background: #fff; color: #1a1a1a; font-family: Helvetica, Arial, sans-serif; }
  .page { width: 1120px; margin: 16px auto; }
  h1 { margin: 0 0 10px; font-size: 17px; font-weight: 700; text-align: center; letter-spacing: 0.3px; }
</style>
</head>
<body>
<div class="page">
  <h1>Use Case Diagram — Data Management Module</h1>

  <svg width="1100" height="560" viewBox="0 0 1100 560" font-family="Helvetica, Arial, sans-serif">
    <defs>
      <marker id="openArrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto">
        <path d="M1,1 L11,6 L1,11" fill="none" stroke="#444" stroke-width="1.4"/>
      </marker>
    </defs>

    <!-- System boundary -->
    <rect x="300" y="40" width="500" height="480" fill="#fff" stroke="#6c8ebf" stroke-width="1.4"/>
    <text x="550" y="62" text-anchor="middle" font-size="13" font-weight="bold">AIRMS — Data Management Module</text>

    <!-- ── Associations ── -->
    <g stroke="#444" stroke-width="1.2">
      <!-- Medical Staff → both imports -->
      <line x1="138" y1="140" x2="435" y2="112"/>
      <line x1="138" y1="148" x2="435" y2="206"/>
      <!-- Administrator → both imports + backup -->
      <line x1="138" y1="400" x2="435" y2="122"/>
      <line x1="138" y1="408" x2="435" y2="216"/>
      <line x1="138" y1="416" x2="435" y2="452"/>
      <!-- Vision AI Provider → Import HoloMotion -->
      <line x1="962" y1="150" x2="665" y2="206"/>
      <!-- System → Validate & Preview -->
      <line x1="962" y1="430" x2="665" y2="336"/>
    </g>

    <!-- ── «include» dependencies ── -->
    <g stroke="#444" stroke-width="1.2" stroke-dasharray="6 4" fill="none">
      <line x1="520" y1="137" x2="500" y2="305" marker-end="url(#openArrow)"/>
      <line x1="560" y1="237" x2="572" y2="305" marker-end="url(#openArrow)"/>
    </g>
    <text x="482" y="230" text-anchor="middle" font-size="11" font-style="italic">&#171;include&#187;</text>
    <text x="608" y="278" text-anchor="middle" font-size="11" font-style="italic">&#171;include&#187;</text>

    <!-- ── Use cases ── -->
    <g>
      <ellipse cx="550" cy="110" rx="115" ry="27" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.3"/>
      <text x="550" y="107" text-anchor="middle" font-size="12">Import Excel</text>
      <text x="550" y="121" text-anchor="middle" font-size="12">Screening Data</text>

      <ellipse cx="550" cy="210" rx="115" ry="27" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.3"/>
      <text x="550" y="207" text-anchor="middle" font-size="12">Import HoloMotion</text>
      <text x="550" y="221" text-anchor="middle" font-size="12">PDF Report</text>

      <ellipse cx="550" cy="335" rx="120" ry="28" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.3"/>
      <text x="550" y="332" text-anchor="middle" font-size="12">Validate &amp; Preview</text>
      <text x="550" y="346" text-anchor="middle" font-size="12">Import Data</text>

      <ellipse cx="550" cy="450" rx="115" ry="27" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.3"/>
      <text x="550" y="454" text-anchor="middle" font-size="12">Export Data Backup</text>
    </g>

    <!-- ── Actors ── -->
    <!-- Medical Staff -->
    <g stroke="#1a1a1a" stroke-width="1.5" fill="none">
      <circle cx="110" cy="100" r="11"/>
      <line x1="110" y1="111" x2="110" y2="142"/>
      <line x1="94" y1="122" x2="126" y2="122"/>
      <line x1="110" y1="142" x2="96" y2="166"/>
      <line x1="110" y1="142" x2="124" y2="166"/>
    </g>
    <text x="110" y="184" text-anchor="middle" font-size="12" font-weight="bold">Medical Staff</text>

    <!-- Administrator -->
    <g stroke="#1a1a1a" stroke-width="1.5" fill="none">
      <circle cx="110" cy="360" r="11"/>
      <line x1="110" y1="371" x2="110" y2="402"/>
      <line x1="94" y1="382" x2="126" y2="382"/>
      <line x1="110" y1="402" x2="96" y2="426"/>
      <line x1="110" y1="402" x2="124" y2="426"/>
    </g>
    <text x="110" y="444" text-anchor="middle" font-size="12" font-weight="bold">Administrator</text>

    <!-- Vision AI Provider (external system actor) -->
    <g stroke="#1a1a1a" stroke-width="1.5" fill="none">
      <circle cx="990" cy="110" r="11"/>
      <line x1="990" y1="121" x2="990" y2="152"/>
      <line x1="974" y1="132" x2="1006" y2="132"/>
      <line x1="990" y1="152" x2="976" y2="176"/>
      <line x1="990" y1="152" x2="1004" y2="176"/>
    </g>
    <text x="990" y="194" text-anchor="middle" font-size="12" font-weight="bold">Vision AI Provider</text>
    <text x="990" y="208" text-anchor="middle" font-size="10.5" font-style="italic">&#171;external system&#187;</text>

    <!-- System -->
    <g stroke="#1a1a1a" stroke-width="1.5" fill="none">
      <circle cx="990" cy="390" r="11"/>
      <line x1="990" y1="401" x2="990" y2="432"/>
      <line x1="974" y1="412" x2="1006" y2="412"/>
      <line x1="990" y1="432" x2="976" y2="456"/>
      <line x1="990" y1="432" x2="1004" y2="456"/>
    </g>
    <text x="990" y="474" text-anchor="middle" font-size="12" font-weight="bold">System</text>

  </svg>
</div>
</body>
</html>
