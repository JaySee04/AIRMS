<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>AIRMS — Activity Diagram: Screening Data Import</title>
<style>
  html, body { margin: 0; padding: 0; background: #fff; color: #1a1a1a; font-family: Helvetica, Arial, sans-serif; }
  .page { width: 1020px; margin: 16px auto; }
  h1 { margin: 0 0 10px; font-size: 17px; font-weight: 700; text-align: center; letter-spacing: 0.3px; }
</style>
</head>
<body>
<div class="page">
  <h1>Activity Diagram — Screening Data Import (Excel / HoloMotion PDF)</h1>

  <svg width="1000" height="1000" viewBox="0 0 1000 1000" font-family="Helvetica, Arial, sans-serif">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
        <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
      </marker>
    </defs>

    <!-- ── Flows ── -->
    <g stroke="#444" stroke-width="1.3" fill="none">
      <line x1="500" y1="39" x2="500" y2="56" marker-end="url(#arrow)"/>
      <line x1="500" y1="104" x2="500" y2="131" marker-end="url(#arrow)"/>

      <!-- branch: Excel (left) -->
      <path d="M 425 170 L 260 170 L 260 246" marker-end="url(#arrow)"/>
      <!-- branch: PDF (right) -->
      <path d="M 575 170 L 740 170 L 740 246" marker-end="url(#arrow)"/>

      <!-- left column -->
      <line x1="260" y1="298" x2="260" y2="336" marker-end="url(#arrow)"/>
      <line x1="260" y1="388" x2="260" y2="426" marker-end="url(#arrow)"/>
      <!-- left merge -->
      <path d="M 260 478 L 260 620 L 366 620" marker-end="url(#arrow)"/>

      <!-- right column -->
      <line x1="740" y1="298" x2="740" y2="336" marker-end="url(#arrow)"/>
      <line x1="740" y1="388" x2="740" y2="426" marker-end="url(#arrow)"/>
      <line x1="740" y1="478" x2="740" y2="516" marker-end="url(#arrow)"/>
      <!-- right merge -->
      <path d="M 740 568 L 740 620 L 634 620" marker-end="url(#arrow)"/>

      <!-- preview → confirm decision -->
      <line x1="500" y1="644" x2="500" y2="686" marker-end="url(#arrow)"/>

      <!-- [no] → discard → end -->
      <line x1="585" y1="720" x2="656" y2="720" marker-end="url(#arrow)"/>
      <line x1="745" y1="744" x2="745" y2="786" marker-end="url(#arrow)"/>

      <!-- [yes] → commit → dashboards → end -->
      <line x1="500" y1="754" x2="500" y2="786" marker-end="url(#arrow)"/>
      <line x1="500" y1="842" x2="500" y2="876" marker-end="url(#arrow)"/>
      <line x1="500" y1="928" x2="500" y2="956" marker-end="url(#arrow)"/>
    </g>

    <!-- Guard labels -->
    <text x="330" y="160" font-size="11" font-style="italic">[Excel file]</text>
    <text x="590" y="160" font-size="11" font-style="italic">[HoloMotion PDF]</text>
    <text x="610" y="710" font-size="11" font-style="italic">[no]</text>
    <text x="510" y="772" font-size="11" font-style="italic">[yes]</text>

    <!-- ── Start node ── -->
    <circle cx="500" cy="30" r="9" fill="#1a1a1a"/>

    <!-- ── Actions ── -->
    <g>
      <rect x="400" y="58" width="200" height="46" rx="12" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.3"/>
      <text x="500" y="78" text-anchor="middle" font-size="12">Operator uploads</text>
      <text x="500" y="93" text-anchor="middle" font-size="12">screening file</text>

      <!-- File type decision -->
      <polygon points="500,133 578,170 500,207 422,170" fill="#fff" stroke="#6c8ebf" stroke-width="1.3"/>
      <text x="500" y="174" text-anchor="middle" font-size="12">File type?</text>

      <!-- Left (Excel) -->
      <rect x="150" y="248" width="220" height="50" rx="12" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.3"/>
      <text x="260" y="277" text-anchor="middle" font-size="12">Parse workbook rows</text>

      <rect x="150" y="338" width="220" height="50" rx="12" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.3"/>
      <text x="260" y="358" text-anchor="middle" font-size="12">Validate required fields</text>
      <text x="260" y="373" text-anchor="middle" font-size="12">and enumerations</text>

      <rect x="150" y="428" width="220" height="50" rx="12" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.3"/>
      <text x="260" y="448" text-anchor="middle" font-size="12">Mark rows create / update;</text>
      <text x="260" y="463" text-anchor="middle" font-size="12">attach row-level errors</text>

      <!-- Right (HoloMotion PDF) -->
      <rect x="630" y="248" width="220" height="50" rx="12" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.3"/>
      <text x="740" y="268" text-anchor="middle" font-size="12">Render PDF pages 1&#8211;3</text>
      <text x="740" y="283" text-anchor="middle" font-size="12">to images</text>

      <rect x="630" y="338" width="220" height="50" rx="12" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.3"/>
      <text x="740" y="358" text-anchor="middle" font-size="12">Vision AI model extracts</text>
      <text x="740" y="373" text-anchor="middle" font-size="12">structured JSON</text>

      <rect x="630" y="428" width="220" height="50" rx="12" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.3"/>
      <text x="740" y="448" text-anchor="middle" font-size="12">Operator supplies Athlete ID,</text>
      <text x="740" y="463" text-anchor="middle" font-size="12">Sport, Program</text>

      <rect x="630" y="518" width="220" height="50" rx="12" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.3"/>
      <text x="740" y="547" text-anchor="middle" font-size="12">Validate extracted fields</text>

      <!-- Preview (merge) -->
      <rect x="368" y="596" width="264" height="48" rx="12" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.3"/>
      <text x="500" y="616" text-anchor="middle" font-size="12">Display preview</text>
      <text x="500" y="631" text-anchor="middle" font-size="12">(no data committed)</text>

      <!-- Confirm decision -->
      <polygon points="500,688 588,720 500,752 412,720" fill="#fff" stroke="#6c8ebf" stroke-width="1.3"/>
      <text x="500" y="717" text-anchor="middle" font-size="12">Operator</text>
      <text x="500" y="731" text-anchor="middle" font-size="12">confirms?</text>

      <!-- Discard -->
      <rect x="660" y="696" width="170" height="48" rx="12" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.3"/>
      <text x="745" y="724" text-anchor="middle" font-size="12">Discard preview</text>

      <!-- Commit -->
      <rect x="368" y="788" width="264" height="54" rx="12" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.3"/>
      <text x="500" y="809" text-anchor="middle" font-size="12">Commit to database (upsert</text>
      <text x="500" y="824" text-anchor="middle" font-size="12">athlete, replace muscle flags)</text>

      <!-- Dashboards -->
      <rect x="368" y="878" width="264" height="50" rx="12" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.3"/>
      <text x="500" y="898" text-anchor="middle" font-size="12">Dashboards reflect new</text>
      <text x="500" y="913" text-anchor="middle" font-size="12">screening data</text>
    </g>

    <!-- ── End nodes ── -->
    <g>
      <circle cx="500" cy="970" r="11" fill="none" stroke="#1a1a1a" stroke-width="1.6"/>
      <circle cx="500" cy="970" r="5.5" fill="#1a1a1a"/>
      <circle cx="745" cy="800" r="11" fill="none" stroke="#1a1a1a" stroke-width="1.6"/>
      <circle cx="745" cy="800" r="5.5" fill="#1a1a1a"/>
    </g>

  </svg>
</div>
</body>
</html>
