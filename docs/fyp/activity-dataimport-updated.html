<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>AIRMS — Activity Diagram: Screening Data Import</title>
<style>
  html, body { margin: 0; padding: 0; background: #fff; color: #1a1a1a; font-family: Helvetica, Arial, sans-serif; }
  .page { width: 1020px; margin: 16px auto; }
  h1 { margin: 0 0 10px; font-size: 17px; font-weight: 700; text-align: center; letter-spacing: 0.3px; }
</style>
</head>
<body>
<div class="page">
  <h1>Activity Diagram — Screening Data Import (HoloMotion PDF, batch)</h1>

  <svg width="1000" height="1100" viewBox="0 0 1000 1100" font-family="Helvetica, Arial, sans-serif">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
        <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
      </marker>
    </defs>

    <!-- ── Flows ── -->
    <g stroke="#444" stroke-width="1.3" fill="none">
      <line x1="500" y1="39" x2="500" y2="56" marker-end="url(#arrow)"/>
      <line x1="500" y1="104" x2="500" y2="136" marker-end="url(#arrow)"/>
      <line x1="500" y1="186" x2="500" y2="218" marker-end="url(#arrow)"/>
      <line x1="500" y1="268" x2="500" y2="306" marker-end="url(#arrow)"/>

      <!-- name-match branch -->
      <path d="M 422 345 L 260 345 L 260 416" marker-end="url(#arrow)"/>
      <path d="M 578 345 L 740 345 L 740 416" marker-end="url(#arrow)"/>
      <!-- merge into preview -->
      <path d="M 260 468 L 260 545 L 366 545" marker-end="url(#arrow)"/>
      <path d="M 740 468 L 740 545 L 634 545" marker-end="url(#arrow)"/>

      <!-- preview → confirm -->
      <line x1="500" y1="569" x2="500" y2="606" marker-end="url(#arrow)"/>

      <!-- [no] → skip → more-reports -->
      <line x1="585" y1="640" x2="656" y2="640" marker-end="url(#arrow)"/>
      <path d="M 745 664 L 745 810 L 592 810" marker-end="url(#arrow)"/>

      <!-- [yes] → commit → more-reports -->
      <line x1="500" y1="674" x2="500" y2="706" marker-end="url(#arrow)"/>
      <line x1="500" y1="760" x2="500" y2="778" marker-end="url(#arrow)"/>

      <!-- more-reports loop back up to render -->
      <path d="M 412 810 L 100 810 L 100 243 L 366 243" marker-end="url(#arrow)"/>

      <!-- more-reports [no] → dashboards → end -->
      <line x1="500" y1="842" x2="500" y2="886" marker-end="url(#arrow)"/>
      <line x1="500" y1="936" x2="500" y2="966" marker-end="url(#arrow)"/>
    </g>

    <!-- Guard labels -->
    <text x="300" y="336" font-size="11" font-style="italic">[name matches roster]</text>
    <text x="592" y="336" font-size="11" font-style="italic">[new athlete]</text>
    <text x="606" y="630" font-size="11" font-style="italic">[no]</text>
    <text x="510" y="694" font-size="11" font-style="italic">[yes]</text>
    <text x="330" y="800" font-size="11" font-style="italic">[more reports]</text>
    <text x="510" y="862" font-size="11" font-style="italic">[queue empty]</text>

    <!-- ── Start node ── -->
    <circle cx="500" cy="30" r="9" fill="#1a1a1a"/>

    <!-- ── Actions ── -->
    <g>
      <rect x="380" y="58" width="240" height="46" rx="12" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.3"/>
      <text x="500" y="78" text-anchor="middle" font-size="12">Operator drops one or more</text>
      <text x="500" y="93" text-anchor="middle" font-size="12">HoloMotion PDFs</text>

      <rect x="370" y="138" width="260" height="48" rx="12" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.3"/>
      <text x="500" y="158" text-anchor="middle" font-size="12">Render next report&#8217;s data</text>
      <text x="500" y="173" text-anchor="middle" font-size="12">sections to images</text>

      <rect x="370" y="220" width="260" height="48" rx="12" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.3"/>
      <text x="500" y="240" text-anchor="middle" font-size="12">Vision AI model extracts</text>
      <text x="500" y="255" text-anchor="middle" font-size="12">structured data (one call/report)</text>

      <!-- name-match decision -->
      <polygon points="500,308 580,345 500,382 420,345" fill="#fff" stroke="#6c8ebf" stroke-width="1.3"/>
      <text x="500" y="341" text-anchor="middle" font-size="11">Extracted name</text>
      <text x="500" y="355" text-anchor="middle" font-size="11">on roster?</text>

      <rect x="150" y="418" width="220" height="50" rx="12" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.3"/>
      <text x="260" y="438" text-anchor="middle" font-size="12">Auto-fill Athlete ID,</text>
      <text x="260" y="453" text-anchor="middle" font-size="12">Sport, Programme</text>

      <rect x="630" y="418" width="220" height="50" rx="12" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.3"/>
      <text x="740" y="438" text-anchor="middle" font-size="12">Operator enters details</text>
      <text x="740" y="453" text-anchor="middle" font-size="12">(sport from ISN 52-sport list)</text>

      <!-- Preview (merge) -->
      <rect x="368" y="521" width="264" height="48" rx="12" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.3"/>
      <text x="500" y="541" text-anchor="middle" font-size="12">Display preview</text>
      <text x="500" y="556" text-anchor="middle" font-size="12">(no data committed)</text>

      <!-- Confirm decision -->
      <polygon points="500,608 588,640 500,672 412,640" fill="#fff" stroke="#6c8ebf" stroke-width="1.3"/>
      <text x="500" y="637" text-anchor="middle" font-size="12">Operator</text>
      <text x="500" y="651" text-anchor="middle" font-size="12">confirms?</text>

      <!-- Skip -->
      <rect x="660" y="616" width="170" height="48" rx="12" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.3"/>
      <text x="745" y="644" text-anchor="middle" font-size="12">Skip this report</text>

      <!-- Commit -->
      <rect x="368" y="708" width="264" height="52" rx="12" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.3"/>
      <text x="500" y="728" text-anchor="middle" font-size="12">Upsert athlete record;</text>
      <text x="500" y="743" text-anchor="middle" font-size="12">replace muscle flags (transaction)</text>

      <!-- more-reports decision -->
      <polygon points="500,780 590,810 500,840 410,810" fill="#fff" stroke="#6c8ebf" stroke-width="1.3"/>
      <text x="500" y="807" text-anchor="middle" font-size="11">More reports</text>
      <text x="500" y="821" text-anchor="middle" font-size="11">in queue?</text>

      <!-- Dashboards -->
      <rect x="368" y="888" width="264" height="48" rx="12" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.3"/>
      <text x="500" y="908" text-anchor="middle" font-size="12">Dashboards reflect new</text>
      <text x="500" y="923" text-anchor="middle" font-size="12">screening data</text>
    </g>

    <!-- ── End node ── -->
    <g>
      <circle cx="500" cy="980" r="11" fill="none" stroke="#1a1a1a" stroke-width="1.6"/>
      <circle cx="500" cy="980" r="5.5" fill="#1a1a1a"/>
    </g>

  </svg>
</div>
</body>
</html>
